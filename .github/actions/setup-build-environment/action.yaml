name: "Setup Build Environment"
description: "Sets up MSVC, vcpkg, and caching for build jobs. Requires code to be checked out first."
inputs:
    cache-key-suffix:
        description: "A suffix to make the cache key unique (e.g., validation, tests)"
        required: true
    cmake-preset:
        description: "The CMake configure preset name. Used to resolve the expected generator for cache validation."
        required: false
        default: "ALL"
    build-dir:
        description: "The CMake binary directory to cache."
        required: false
        default: "build/ALL"
outputs:
    msvc-version:
        description: "The detected MSVC compiler version"
        value: ${{ steps.msvc_version.outputs.version }}
runs:
    using: "composite"
    steps:
        # Single source of truth for the cache trust split below. head.repo.fork
        # is unusable here (this repo is itself an upstream fork); compare full_name.
        - name: Determine cache-write trust
          id: trust
          shell: bash
          run: |
              if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.event_name }}" != "pull_request_target" ]]; then
                  trusted=true
              elif [[ "${{ github.event_name }}" == "pull_request_target" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.event.pull_request.base.repo.full_name }}" ]]; then
                  case "${{ github.event.pull_request.author_association }}" in
                      OWNER | MEMBER | COLLABORATOR) trusted=true ;;
                      *) trusted=false ;;
                  esac
              else
                  trusted=false
              fi
              echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

        - name: Enable Git Long Paths
          run: git config --system core.longpaths true
          shell: bash

        # Pin vcpkg's download cache to a stable, cacheable path. vcpkg checks
        # this directory (by SHA512) before fetching any asset -- port source
        # tarballs AND tools acquired via vcpkg_find_acquire_program (e.g. the
        # pinned PowerShell-core zip applocal.ps1 needs). Caching it (below)
        # lets those downloads survive across runs, so a transient GitHub
        # releases 504 on a cache-cold tool fetch can't fail the build.
        - name: Pin vcpkg downloads directory
          shell: bash
          run: echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"

        - name: Install CMake 4.x
          uses: lukka/get-cmake@v4.3.3
          with:
              cmakeVersion: "~4.2.0"
              useCloudCache: false

        - name: Setup MSVC environment
          # windows-2025-vs2026 ships VS2026 preinstalled (VC.Tools.x86.x64 +
          # Windows11SDK.26100), so this just detects it; no install step needed.
          # Swapped from ilammy/msvc-dev-cmd@v1 (node20, deprecated) to
          # TheMrMilchmann/setup-msvc-dev@v4 (node24), which has no `vsversion`
          # input -- default detection picks up the preinstalled toolset.
          uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
          with:
              arch: x64

        - name: Get MSVC version
          id: msvc_version
          shell: pwsh
          run: |
              "int main() { return 0; }" | Out-File -FilePath "dummy.cpp" -Encoding ASCII
              # After a reboot-pending VS Build Tools install (exit 3010), cl.exe
              # can be transiently unresolvable / emit no version on the first
              # probe — the flake that fails the cache-build jobs. Retry the probe.
              $version = $null
              for ($attempt = 1; $attempt -le 5 -and -not $version; $attempt++) {
                  if ($attempt -gt 1) {
                      Write-Warning "MSVC probe attempt ${attempt}: cl.exe not ready yet, retrying..."
                      Start-Sleep -Seconds 10
                  }
                  try { $output = & cl.exe /Bv dummy.cpp 2>&1 } catch { $output = "$_" }
                  foreach ($line in ($output -split "`n|`r")) {
                      if ($line -match 'Version ([0-9]+\.[0-9]+\.[0-9]+)') {
                          $version = $Matches[1]
                          break
                      }
                      elseif ($line -match '([0-9]+\.[0-9]+\.[0-9]+)') {
                          $version = $Matches[1]
                          break
                      }
                  }
              }
              if ($version) {
                  Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding UTF8
                  # Major.minor of the cl.exe version (e.g. 19.51) -- used for
                  # cache keys so a compiler patch bump (19.51.x -> 19.51.y)
                  # doesn't bust the build cache. Within a minor the ABI is
                  # stable; ninja still recompiles genuinely changed TUs.
                  if ($version -match '^([0-9]+\.[0-9]+)') {
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "version_mm=$($Matches[1])" -Encoding UTF8
                  } else {
                      Add-Content -Path $env:GITHUB_OUTPUT -Value "version_mm=$version" -Encoding UTF8
                  }
              } else {
                  throw "MSVC version not found after 5 cl.exe probe attempts"
              }
              Remove-Item "dummy.cpp" -ErrorAction SilentlyContinue

        # lukka/run-vcpkg's own bootstrap-vcpkg.bat has no retry, so a transient
        # vcpkg.exe download failure hard-fails the build. Do the clone +
        # bootstrap here instead, wrapped in retry.
        - name: Bootstrap vcpkg.exe (retry)
          uses: nick-fields/retry@v4
          with:
              timeout_minutes: 10
              max_attempts: 3
              retry_wait_seconds: 30
              shell: pwsh
              command: |
                  $vcpkgDir = "${{ github.workspace }}/vcpkg"
                  $vcpkgExe = Join-Path $vcpkgDir "vcpkg.exe"
                  $commitId = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
                  if (Test-Path $vcpkgExe) {
                      Write-Host "vcpkg.exe already present, skipping bootstrap."
                  } else {
                      if (-not (Test-Path $vcpkgDir)) {
                          git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
                      }
                      Push-Location $vcpkgDir
                      git fetch origin $commitId
                      git checkout $commitId
                      & .\bootstrap-vcpkg.bat -disableMetrics
                      Pop-Location
                      if (-not (Test-Path $vcpkgExe)) { throw "vcpkg.exe missing after bootstrap" }
                  }
                  # run-vcpkg's own up-to-date check reads this sentinel, not the
                  # executable's presence -- without it, Setup vcpkg still re-runs
                  # its un-retried bootstrap on every job.
                  $commitId | Out-File -FilePath (Join-Path $vcpkgDir "vcpkgLastBuiltCommitId") -NoNewline -Encoding ascii

        - name: Setup vcpkg
          uses: lukka/run-vcpkg@v11.6
          with:
              vcpkgJsonGlob: vcpkg.json
              # vcpkg.exe + the sentinel written above make run-vcpkg's own
              # checks skip its un-retried clone/bootstrap. Do NOT install here
              # either -- that runs later during the retry-wrapped cmake configure.
              runVcpkgInstall: false

        # vcpkg download (asset) cache. Keyed on the manifest + baseline, NOT
        # the compiler -- the set of fetched assets only changes when deps or
        # the baseline change, so this survives VS toolset drift. Same
        # trusted-write / untrusted-restore split as the build cache below.
        - name: Cache vcpkg downloads (trusted, restore + save)
          if: steps.trust.outputs.trusted == 'true'
          uses: actions/cache@v5
          with:
              path: ${{ github.workspace }}/vcpkg_downloads
              key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
              restore-keys: |
                  ${{ runner.os }}-vcpkg-downloads-

        - name: Restore vcpkg downloads (untrusted PR, restore-only)
          if: steps.trust.outputs.trusted == 'false'
          uses: actions/cache/restore@v5
          with:
              path: ${{ github.workspace }}/vcpkg_downloads
              key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
              restore-keys: |
                  ${{ runner.os }}-vcpkg-downloads-

        # Cache strategy is split by event trust level to avoid the
        # pull_request_target cache-poisoning class of bug (CodeQL rule
        # `actions/cache-poisoning/poisonable-step`):
        #
        # - Trusted events (push to dev/main, workflow_dispatch, workflow_call
        #   from a release pipeline): use the combined `actions/cache` which
        #   restores at this step and auto-saves at job-end. Cache writes only
        #   happen from these trusted contexts.
        # - Untrusted events (pull_request, and pull_request_target from a
        #   fork or a non-collaborator): use the
        #   restore-only sub-action. PR builds still benefit from caches
        #   warmed by trusted runs but cannot themselves write back, so a
        #   malicious PR cannot poison a cache that a later default-branch
        #   run would consume.
        #
        # Both steps use the same key / restore-keys so cache hits cross the
        # trust boundary in the allowed direction (trusted-saved → untrusted-restore).

        - name: Cache CMake build output (trusted, restore + save)
          if: steps.trust.outputs.trusted == 'true'
          uses: actions/cache@v5
          with:
              path: ${{ inputs.build-dir }}
              key: ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-${{ github.event.inputs.cache-key-suffix || 'default' }}-${{ hashFiles('.gitmodules', 'extern/**', 'CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json') }}
              restore-keys: |
                  ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-${{ github.event.inputs.cache-key-suffix || 'default' }}-
                  ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-

        - name: Restore CMake build cache (untrusted PR, restore-only)
          if: steps.trust.outputs.trusted == 'false'
          uses: actions/cache/restore@v5
          with:
              path: ${{ inputs.build-dir }}
              key: ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-${{ github.event.inputs.cache-key-suffix || 'default' }}-${{ hashFiles('.gitmodules', 'extern/**', 'CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json') }}
              restore-keys: |
                  ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-${{ github.event.inputs.cache-key-suffix || 'default' }}-
                  ${{ runner.os }}-cmake-msvc-${{ steps.msvc_version.outputs.version_mm }}-${{ inputs.cache-key-suffix }}-${{ inputs.cmake-preset }}-

        - name: Remove stale CMake cache if configuration changed
          shell: pwsh
          run: |
              $buildDir = "${{ inputs.build-dir }}"
              $cacheFile = "$buildDir/CMakeCache.txt"
              if (Test-Path $cacheFile) {
                $content = Get-Content $cacheFile -Raw
                $stale = $false

                # Check drive letter mismatch
                $expected = (Resolve-Path .).Path.Substring(0,1)
                if ($content -match 'CMAKE_HOME_DIRECTORY:INTERNAL=([A-Z]):') {
                  if ($Matches[1] -ne $expected) {
                    Write-Host "❌ Cache drive mismatch."
                    $stale = $true
                  }
                }

                # Check generator mismatch — resolve the expected generator from the
                # configure preset, following the inherits chain.
                if ($content -match 'CMAKE_GENERATOR:INTERNAL=(.+)') {
                  $cachedGenerator = $Matches[1].Trim()
                  $allPresets = (Get-Content "CMakePresets.json" -Raw | ConvertFrom-Json).configurePresets
                  function Resolve-PresetGenerator([string]$name, [int]$depth = 0) {
                    if ($depth -gt 10) { return $null }
                    $p = $allPresets | Where-Object { $_.name -eq $name } | Select-Object -First 1
                    if (-not $p) { return $null }
                    if ($p.generator) { return $p.generator }
                    $parents = if ($p.inherits -is [array]) { $p.inherits } else { @($p.inherits) }
                    foreach ($parent in $parents) {
                      $gen = Resolve-PresetGenerator $parent ($depth + 1)
                      if ($gen) { return $gen }
                    }
                    return $null
                  }
                  $expectedGenerator = Resolve-PresetGenerator "${{ inputs.cmake-preset }}"
                  if ($expectedGenerator -and $expectedGenerator -ne $cachedGenerator) {
                    Write-Host "❌ Generator mismatch: cached='$cachedGenerator', expected='$expectedGenerator'"
                    $stale = $true
                  }
                }

                # Check generator instance mismatch — CMAKE_GENERATOR_INSTANCE pins
                # the exact VS install path found at configure time. If a runner
                # image or toolchain change moves or removes that path, CMake fails
                # hard instead of re-detecting a new instance.
                if ($content -match 'CMAKE_GENERATOR_INSTANCE:INTERNAL=(.+)') {
                  $cachedInstance = $Matches[1].Trim()
                  if ($cachedInstance -and -not (Test-Path $cachedInstance)) {
                    Write-Host "❌ Generator instance gone: cached='$cachedInstance' no longer exists."
                    $stale = $true
                  }
                }

                # Check vcpkg triplet mismatch — a triplet change (e.g. a
                # release-only triplet) installs vcpkg_installed/ under a new
                # directory and strips the old one, but find_library() results
                # cached in CMakeCache.txt keep pointing at the gone path.
                if ($content -match 'VCPKG_TARGET_TRIPLET:\w+=(.+)') {
                  $cachedTriplet = $Matches[1].Trim()
                  $allPresets = (Get-Content "CMakePresets.json" -Raw | ConvertFrom-Json).configurePresets
                  function Resolve-PresetTriplet([string]$name, [int]$depth = 0) {
                    if ($depth -gt 10) { return $null }
                    $p = $allPresets | Where-Object { $_.name -eq $name } | Select-Object -First 1
                    if (-not $p) { return $null }
                    $tv = $p.cacheVariables.VCPKG_TARGET_TRIPLET
                    if ($tv) { if ($tv.value) { return $tv.value } else { return $tv } }
                    $parents = if ($p.inherits -is [array]) { $p.inherits } else { @($p.inherits) }
                    foreach ($parent in $parents) {
                      $t = Resolve-PresetTriplet $parent ($depth + 1)
                      if ($t) { return $t }
                    }
                    return $null
                  }
                  $expectedTriplet = Resolve-PresetTriplet "${{ inputs.cmake-preset }}"
                  if ($expectedTriplet -and $expectedTriplet -ne $cachedTriplet) {
                    Write-Host "❌ vcpkg triplet mismatch: cached='$cachedTriplet', expected='$expectedTriplet'"
                    $stale = $true
                  }
                }

                if ($stale) {
                  Write-Host "Removing stale $buildDir directory."
                  Remove-Item -Recurse -Force $buildDir
                }
              }

        # Pre-install vcpkg deps via a CMake configure, wrapped in retry. This
        # is the step that hits the network for vcpkg ports/tools (the
        # vcpkg.exe bootstrap itself is retried separately above), so a
        # transient GitHub-releases 504 (e.g. the PowerShell-core fetch) gets
        # retried here instead of failing the build. Subsequent run-cmake steps
        # in the calling job reuse this warm configure + the cached downloads,
        # so they do no further network I/O. -DBUILD_SHADER_TESTS=OFF keeps the
        # warm-up minimal; jobs that need the shader_tests target reconfigure
        # with =ON (no re-download -- deps are independent of that flag).
        - name: Pre-install vcpkg dependencies (retry)
          uses: nick-fields/retry@v4
          with:
              timeout_minutes: 30
              max_attempts: 3
              retry_wait_seconds: 30
              shell: pwsh
              command: cmake --preset ${{ inputs.cmake-preset }} -DBUILD_SHADER_TESTS=OFF
