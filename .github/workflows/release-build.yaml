name: "Release: Build Artifacts"

on:
    push:
        tags:
            - "v*"
    release:
        # 'published' covers semantic-release's draft → human publish path
        # (drafts do not fire the 'created' event in practice). 'created'
        # remains for non-draft releases authored directly via the UI/API.
        types: [created, published]
    workflow_dispatch:
        inputs:
            cache-key-suffix:
                description: "Optional suffix to invalidate the build cache"
                required: false
            build-cpp:
                description: "Build C++ plugin and addons for manual dispatch"
                type: boolean
                required: false
                default: true
            validate-shaders:
                description: "Run HLSL shader validation for manual dispatch"
                type: boolean
                required: false
                default: true

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.ref }}
            repository: ${{ github.repository }}
            run-cpp: ${{ github.event_name != 'workflow_dispatch' || inputs.build-cpp == true }}
            run-shader-validation: ${{ github.event_name != 'workflow_dispatch' || inputs.validate-shaders == true }}
            run-shader-tests: ${{ github.event_name != 'workflow_dispatch' || inputs.validate-shaders == true }}
            cache-key-suffix: ${{ inputs.cache-key-suffix || '' }}
            cache-artifacts: true
            # Cache build only needs the release-parity (profile) pass.
            run-full-config-validation: false

    release:
        name: Post Release for Draft, Manual Run, or Tag
        needs: [build]
        if: >
            always() && !cancelled() &&
            needs.build.outputs.cpp-built == 'true' &&
            (github.event_name == 'workflow_dispatch' ||
             startsWith(github.ref, 'refs/tags/v') ||
             (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        # No compilation here: artifact download, gh/jq notes, 7z packaging
        # (already proven on ubuntu-latest by shader-cache.yaml's Package job),
        # and the publish-release composite.
        runs-on: ubuntu-latest
        outputs:
            release_tag: ${{ steps.combined_notes.outputs.release_tag }}
        permissions:
            contents: write
        steps:
            # Sparse-checkout the composite action FIRST: actions/checkout's
            # default clean would wipe the artifacts downloaded below if it ran
            # after them. Only .github/actions is fetched; gh still resolves the
            # repo via GH_REPO in the notes step.
            - name: Check out composite action
              uses: actions/checkout@v6
              with:
                  sparse-checkout: .github/actions

            - name: Ensure ref is a tag
              if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
              shell: bash
              run: |
                  if [ "${{ github.ref_type }}" != "tag" ]; then
                    echo "This workflow must be run on a tag, not a branch."
                    exit 1
                  fi

            - name: Download dist artifacts
              uses: actions/download-artifact@v7
              with:
                  name: dist-artifacts
                  path: dist/

            # The Feature Metadata Summary is already in this body (appended
            # during Semantic Release); just resolve the tag and fetch it.
            - name: Resolve release tag and body
              id: combined_notes
              shell: bash
              # GH_TOKEN: required for `gh release view`; without it the `||`
              # fallback wrote an empty file that clobbered the release body on
              # update (v1.5.1).
              # GH_REPO: pinned so `gh` never infers the repo from git remotes.
              # The checkout above is sparse (actions-only), so don't rely on its
              # remote config -- inference once died "fatal: not a git repository"
              # and aborted the step (v1.5.2 run 25871339509).
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "release" ]; then
                    RELEASE_TAG="${{ github.event.release.tag_name }}"
                  else
                    RELEASE_TAG="${{ github.ref_name }}"
                  fi

                  # Fetch existing body. If the release does not exist yet
                  # (e.g. tag-push trigger before any release was created),
                  # treat empty as acceptable. Any other failure is fatal so
                  # we never clobber a real body with empty content.
                  if gh release view "$RELEASE_TAG" --json body -q .body > auto-release-notes.md 2>/tmp/gh-err; then
                    :
                  else
                    if grep -q 'release not found' /tmp/gh-err; then
                      echo "Release $RELEASE_TAG does not exist yet; starting with empty body."
                      : > auto-release-notes.md
                    else
                      echo "::error::Failed to fetch release body for $RELEASE_TAG:"
                      cat /tmp/gh-err
                      exit 1
                    fi
                  fi
                  echo "body_file=auto-release-notes.md" >> $GITHUB_OUTPUT
                  echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

            # Stage the shared build's ShaderCache-SE/VR artifacts into dist/ as
            # ShaderCache-<runtime>-<tag>.7z so the publish-release step below
            # attaches them via the same dist/*.7z glob as the AIO (nexus-upload
            # globs them off the release). publish-release uses removeArtifacts,
            # so it wipes every asset and re-attaches only dist/*.7z — meaning a
            # runtime whose cache build failed THIS run must be re-supplied from
            # the existing release asset, or removeArtifacts would strip it. This
            # keeps the attach idempotent (re-runs replace cleanly) and safe when
            # one runtime's build leg fails (the other's prior cache is preserved).
            - name: Download shader cache artifacts
              continue-on-error: true
              uses: actions/download-artifact@v7
              with:
                  pattern: ShaderCache-*
                  path: shader-caches/

            - name: Stage shader caches into dist
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ steps.combined_notes.outputs.release_tag }}
              run: |
                  set -euo pipefail
                  for runtime in SE VR; do
                    target="dist/ShaderCache-${runtime}-${RELEASE_TAG}.7z"
                    src="shader-caches/ShaderCache-${runtime}"
                    rm -f "$target"
                    if [ -d "$src" ]; then
                      # Fresh cache from this run. ShaderCache/ root matches
                      # shader-cache.yaml's seed layout. Guard packaging so one
                      # runtime's failure warns instead of aborting the release
                      # under set -e; the other runtime still ships.
                      if rm -rf ShaderCache && mv "$src" ShaderCache && 7z a -t7z -mx=7 "$target" ./ShaderCache >/dev/null; then
                        echo "Staged fresh $target"
                      else
                        echo "::warning::Failed to package fresh ShaderCache-${runtime}; release ships without it."
                      fi
                    elif gh release download "$RELEASE_TAG" --pattern "ShaderCache-${runtime}-${RELEASE_TAG}.7z" --dir dist 2>/dev/null; then
                      # No fresh build this run; preserve the cache already on the
                      # release so removeArtifacts does not drop it.
                      echo "Preserved existing $target"
                    else
                      echo "::warning::No fresh or existing ShaderCache-${runtime}; release ships without it."
                    fi
                  done

            - name: Create or Update Release
              uses: ./.github/actions/publish-release
              with:
                  token: ${{ github.token }}
                  name: "Open Shaders ${{ steps.combined_notes.outputs.release_tag }}"
                  tag: ${{ steps.combined_notes.outputs.release_tag }}
                  draft: "true"
                  omit-draft-during-update: "true"
                  artifacts: "${{ github.workspace }}/dist/*.7z"
                  body-file: ${{ steps.combined_notes.outputs.body_file }}
                  download-artifact: "false"

    nexus-upload:
        # Chained from `release` to avoid the artifact-attachment race a
        # parallel `release: published` trigger on a separate workflow had:
        # the prior release-nexus-trigger.yaml fired in parallel with this
        # build and tried to download artifacts before they existed.
        # Stable tags only (no '-' in the tag name).
        name: Nexus Upload
        needs: [release]
        if: >
            always() && !cancelled() &&
            needs.release.result == 'success' &&
            github.event_name == 'release' &&
            github.event.action == 'published' &&
            !contains(github.event.release.tag_name, '-')
        uses: ./.github/workflows/nexus-upload.yaml
        with:
            tag: ${{ github.event.release.tag_name }}
            # aio mode (the default) ships CommunityShaders_AIO-*.7z to the fork
            # page (180419); leave artifact_pattern unset so it uses that default
            # rather than the CORE archive. Real upload (dry_run=false): the
            # reusable workflow skips a version already on Nexus, so re-runs are safe.
            dry_run: "false"
        # Nested reusable workflows don't auto-inherit repo secrets; inherit
        # passes the UNEX_* set (cookie + API key) without enumerating each.
        secrets: inherit
