# CI self-test harness for workflow / composite-action changes.
#
# WHY: pr-checks runs under pull_request_target, where the workflow
# definitions AND composite actions resolve from the BASE branch. A PR
# therefore can never exercise its own changes to a reusable workflow or a
# composite action (e.g. .github/actions/setup-build-environment). Push a
# branch under ci_test/** to run the full build/validation matrix from THAT
# branch's ref, so CI-infrastructure changes are validated before they merge.
#
# Usage:
#   git push origin <local-branch>:ci_test/<name>
# then watch the "CI self-test" run. Delete the ci_test/* branch when done.
#
# SECURITY: triggered only by `push` (to ci_test/**) and manual
# `workflow_dispatch`. Both are write-access-gated -- forks cannot push to this
# repository's refs and cannot dispatch its workflows -- so this only ever runs
# trusted, same-repo code; it does NOT use the pull_request_target trust
# inversion that fork PRs require. The repository guard below skips it on forks.
# Cache writes use an isolated key suffix (-ci-test) so a ci_test branch can
# never poison the dev / main / PR build caches that production runs consume.
name: "CI self-test"

on:
    push:
        branches: [ci_test/**]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # HARNESS: find a run of this workflow on the parent commit (stands in for release-dev on the release SHA).
    find-dev-shaders:
        if: github.repository == 'alandtse/open-shaders'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            run-id: ${{ steps.find.outputs.run-id }}
        steps:
            - name: Find
              id: find
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PARENT: ${{ github.event.push.before || github.event.before }}
              run: |
                  set -euo pipefail
                  echo "run-id=" >> "$GITHUB_OUTPUT"
                  sha=$(gh api "repos/${GH_REPO}/commits/${{ github.sha }}" --jq '.parents[0].sha')
                  for id in $(gh api "repos/${GH_REPO}/actions/workflows/ci-test.yaml/runs?head_sha=${sha}&per_page=10" --jq '.workflow_runs[].id'); do
                    names=$(gh api "repos/${GH_REPO}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
                    if grep -qx CompiledShaderBinaries-SE <<<"$names" && grep -qx CompiledShaderBinaries-VR <<<"$names" \
                      && grep -qx shader-compile-timing-SE <<<"$names" && grep -qx shader-compile-timing-VR <<<"$names"; then
                      echo "run-id=${id}" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  done

    import-dev-shaders:
        needs: find-dev-shaders
        if: needs.find-dev-shaders.outputs.run-id != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        strategy:
            matrix:
                artifact: [CompiledShaderBinaries-SE, CompiledShaderBinaries-VR, shader-compile-timing-SE, shader-compile-timing-VR]
        steps:
            - uses: actions/download-artifact@v7
              with:
                  name: ${{ matrix.artifact }}
                  path: imported
                  run-id: ${{ needs.find-dev-shaders.outputs.run-id }}
                  github-token: ${{ github.token }}
            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact }}
                  path: imported
                  retention-days: 1
                  if-no-files-found: error

    self-test:
        needs: [find-dev-shaders, import-dev-shaders]
        if: always() && !cancelled() && github.repository == 'alandtse/open-shaders' && needs.import-dev-shaders.result != 'failure'
        uses: ./.github/workflows/_shared-build.yaml
        with:
            ref: ${{ github.sha }}
            repository: ${{ github.repository }}
            run-cpp: true
            run-shader-validation: true
            run-shader-tests: true
            run-cpp-tests: true
            cache-artifacts: true
            upload-compiled-shaders: true
            reuse-compiled-shaders: ${{ needs.find-dev-shaders.outputs.run-id != '' }}
            generate-flip-impact: ${{ needs.find-dev-shaders.outputs.run-id == '' }}
            run-full-config-validation: false
            # Isolate this harness's build caches from production keys so a
            # ci_test branch cannot poison dev / main / PR build caches.
            cache-key-suffix: "-ci-test"

    feature-flip-impact:
        needs: [find-dev-shaders, import-dev-shaders]
        if: always() && !cancelled() && needs.import-dev-shaders.result == 'success'
        permissions:
            contents: read
        uses: ./.github/workflows/_feature-flip-impact.yaml
        with:
            ref: ${{ github.sha }}
            repository: ${{ github.repository }}

    # Same base-branch-resolution problem as self-test above, for the Linux
    # cross-compile job specifically (its own reusable workflow file).
    cross-compile-self-test:
        if: github.repository == 'alandtse/open-shaders'
        uses: ./.github/workflows/_shared-cross-compile.yaml
        with:
            ref: ${{ github.sha }}
            repository: ${{ github.repository }}
            cache-key-suffix: "-ci-test"

    # pr-checks.yaml's "Post Prerelease from PR" and release-build.yaml's
    # "Post Release" jobs call this composite directly and are themselves
    # unreachable from their own PRs (same base-branch-resolution problem as
    # above). dry-run:true skips the actual ncipollo call, so this validates
    # the composite's steps run cleanly on a given runner OS (e.g. a runs-on
    # migration) without creating or mutating a real release/tag.
    post-release-dry-run:
        if: github.repository == 'alandtse/open-shaders'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out composite action
              uses: actions/checkout@v6
              with:
                  sparse-checkout: .github/actions

            - name: Dry-run publish-release composite
              uses: ./.github/actions/publish-release
              with:
                  token: ${{ github.token }}
                  tag: ci-test-dry-run
                  name: "CI self-test dry run"
                  body: "Dry-run self-test; no release is created."
                  dry-run: "true"
                  download-artifact: "false"

    # Run the feature version audit from THIS branch's ref. pr-checks runs it
    # under pull_request_target from the BASE branch, so a change to the audit
    # algorithm itself (e.g. release-stage 0.x logic) can never be exercised by
    # its own PR. Push the change to ci_test/** to verify the verdict here first.
    feature-audit:
        if: github.repository == 'alandtse/open-shaders'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
            - name: Run feature version audit (this branch vs dev)
              run: |
                  set -euo pipefail
                  git fetch origin dev
                  python tools/feature_version_audit.py --pr-check --ci \
                    --base "$(git rev-parse origin/dev)" --head "${{ github.sha }}"
