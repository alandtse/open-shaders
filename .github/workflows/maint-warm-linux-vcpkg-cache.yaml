name: "Maint: Warm Linux vcpkg Cache"

# The only trusted caller of _shared-cross-compile.yaml's save-cache job.
# pr-checks.yaml (pull_request_target, fork-checked-out code) and ci-test.yaml
# stay restore-only by never passing cache-write: true -- see
# _shared-cross-compile.yaml for why that job never holds a write-capable
# token. This workflow only ever runs already-merged dev code, so its token
# is never ambient to unreviewed build-time scripts.

on:
    push:
        branches: [dev]
        paths:
            - "vcpkg.json"
            - "vcpkg-configuration.json"
            - "cmake/ports-linux-clangcl/**"
            - "cmake/triplets/**"
            - "CMakePresets.json"
            - ".github/workflows/_shared-cross-compile.yaml"
            - ".github/workflows/maint-warm-linux-vcpkg-cache.yaml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: warm-linux-vcpkg-cache-${{ github.ref }}
    cancel-in-progress: true

jobs:
    warm:
        permissions:
            contents: read
            actions: write
        uses: ./.github/workflows/_shared-cross-compile.yaml
        with:
            ref: ${{ github.sha }}
            repository: ${{ github.repository }}
            cache-write: true
