name: "(Shared) Feature Flip Impact"

# Runs repo tooling, so it restores no build cache; a failure only costs the release its compile-impact tiers.

on:
    workflow_call:
        inputs:
            ref:
                description: "Ref whose shader sources are preprocessed"
                type: string
                required: true
            repository:
                description: "Repository to check out"
                type: string
                required: true

permissions:
    contents: read

jobs:
    generate:
        name: Generate feature flip impact
        runs-on: windows-2025-vs2026
        continue-on-error: true
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.ref }}
                  repository: ${{ inputs.repository }}
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install generator dependencies
              shell: bash
              run: python -m pip install --quiet pyyaml

            - name: Download shader compile timing reports
              uses: actions/download-artifact@v7
              with:
                  pattern: shader-compile-timing-*
                  path: timing/

            - name: Generate feature flip impact tables
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p flip-impact
                  python tools/feature-flip-impact.py --runtime SE --config .github/configs/shader-validation.yaml --timing timing/shader-compile-timing-SE/shader-compile-timing-SE.json --output flip-impact/FeatureFlipImpact-SE.json
                  python tools/feature-flip-impact.py --runtime VR --config .github/configs/shader-validation-vr.yaml --timing timing/shader-compile-timing-VR/shader-compile-timing-VR.json --output flip-impact/FeatureFlipImpact-VR.json

            - name: Upload feature flip impact tables
              uses: actions/upload-artifact@v7
              with:
                  name: FeatureFlipImpact
                  path: flip-impact/FeatureFlipImpact-*.json
                  retention-days: 30
                  if-no-files-found: error
